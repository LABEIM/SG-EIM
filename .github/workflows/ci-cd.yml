name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  deploy:
    uses: LABEIM/Shared-CICD/.github/workflows/deploy-app.yml@main
    with:
      enable_cloudflare: true
      # [REQUIRED] Update with target Cloudflare Pages project name (e.g., 'project-comingsoon')
      cloudflare_project_name: 'maintenance-eim'
      enable_lighthouse: true
      lighthouse_routes: |
        /
    secrets: inherit
